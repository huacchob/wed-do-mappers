---
sync_devices:
  hostname:
    commands:
      - command: "show system information"
        parser: "ttp"
        jpath: "[0].hostname" # yamllint disable-line rule:quoted-strings
        post_processor: "{{ obj | upper }}"
  serial:
    commands:
      - command: "show chassis detail"
        parser: "ttp"
        jpath: "[0][0].serial || [0].serial" # yamllint disable-line rule:quoted-strings
        post_processor: "{{ obj if obj else 'UNKNOWN' }}"
  device_type:
    commands:
      - command: "show system information"
        parser: "ttp"
        jpath: "[0].device_type" # yamllint disable-line rule:quoted-strings
        post_processor: "{{ obj | upper }}"
  mgmt_interface:
    commands:
      - command: "show router interface system"
        parser: "ttp"
        jpath: "[?ip_address=='{{ obj }}'].system || [?ip_address=='10.12.97.10'].system" # yamllint disable-line rule:quoted-strings
        post_processor: "{{ obj[0] }}"
  mask_length:
    commands:
      - command: "show router interface system"
        parser: "ttp"
        jpath: "[?ip_address=='{{ obj }}'].cidr || [?ip_address=='10.12.97.10'].cidr"
        post_processor: "{{ obj[0] }}"
        iterable_type: "int"
sync_network_data:
  pre_processor:
    mda_map:
      commands:
        - command: "show mda"
          parser: "raw"
          jpath: "raw"
          iterable_type: "dict"
          post_processor: "{% set result = {} %}{% set state = {'slot': ''} %}{% for line in obj.split('\n') %}{% set parts = line.split() %}{% if parts | length == 5 and parts[0][0] in '0123456789' %}{{ state.update({'slot': parts[0]}) or '' }}{{ result.update({parts[0] + '/' + parts[1]: parts[2]}) or '' }}{% elif parts | length == 4 and state.slot and parts[0][0] in '0123456789X' %}{{ result.update({state.slot + '/' + parts[0]: parts[1]}) or '' }}{% endif %}{% endfor %}{{ result | tojson }}"
    port_descriptions:
      commands:
        - command: "show port description"
          parser: "ttp"
          jpath: "[0][0].port_descriptions"
          post_processor: |
            {% set result = {} %}
            {% for entry in obj %}
              {% if entry.port_id %}
                {{ result.update({entry.port_id: entry.description if entry.description else ''}) or '' }}
              {% endif %}
            {% endfor %}
            {{ result | tojson }}
          iterable_type: "dict"
    port_status:
      commands:
        - command: "show port"
          parser: "ttp"
          jpath: "[0][0].ports"
          post_processor: |
            {% set result = {} %}
            {% for row in obj %}
              {% set tokens = row.split() %}
              {% if tokens %}
                {% set port_id = tokens[0] %}
                {% set admin_state = tokens[1] if tokens | length > 1 else '' %}
                {% set link_state = tokens[2] if tokens | length > 2 else '' %}
                {% set oper_state = tokens[3] if tokens | length > 3 else '' %}
                {% set cfg_mtu = tokens[4] if tokens | length > 4 else '' %}
                {% set oper_mtu = tokens[5] if tokens | length > 5 else '' %}
                {% set mode = tokens[7] if tokens | length > 7 else '' %}
                {% set port_type = tokens[9] if tokens | length > 9 else '' %}
                {{ result.update({port_id: {'admin_state': admin_state, 'link_state': link_state, 'oper_state': oper_state, 'cfg_mtu': cfg_mtu, 'oper_mtu': oper_mtu, 'mode': mode, 'port_type': port_type}}) or '' }}
              {% endif %}
            {% endfor %}
            {{ result | tojson }}
          iterable_type: "dict"
  serial:
    commands:
      - command: "show chassis detail"
        parser: "ttp"
        jpath: "[0][0].serial || [0].serial"
        post_processor: "{{ obj if obj else 'UNKNOWN' }}"
        iterable_type: "str"
  interfaces:
    root_key: true
    commands:
      - command: "show port description"
        parser: "ttp"
        jpath: "[0][0].port_descriptions[].port_id"
        post_processor: |
          {% set result = {} %}
          {% for interface in obj %}
          {{ result.update({interface: {}}) or '' }}
          {% endfor %}
          {{ result | tojson }}
  interfaces__type:
    commands:
      - command: "show port"
        parser: "ttp"
        jpath: "[0][0].ports"
        post_processor: "{{ 'ethernet' | map_interface_type }}"
        iterable_type: "str"
  interfaces__description:
    commands:
      - command: "show port description"
        parser: "ttp"
        jpath: "[0][0].port_descriptions"
        post_processor: "{{ port_descriptions.get(current_key, '') }}"
        iterable_type: "str"
  interfaces__link_status:
    commands:
      - command: "show port"
        parser: "ttp"
        jpath: "[0][0].ports"
        post_processor: |
          {% set entry = port_status.get(current_key, {}) %}
          {% if entry.oper_state %}
          {{ entry.oper_state | interface_status_to_bool }}
          {% else %}
          {{ False }}
          {% endif %}
  interfaces__mtu:
    commands:
      - command: "show port"
        parser: "ttp"
        jpath: "[0][0].ports"
        post_processor: |
          {% set entry = port_status.get(current_key, {}) %}
          {% set mtu = entry.cfg_mtu or entry.oper_mtu %}
          {{ mtu or '' }}
        iterable_type: "str"
  modules:
    root_key: true
    commands:
      - command: "show card"
        parser: "ttp"
        jpath: "[0].cards[?admin_state=='up' || admin_state=='down']"
        post_processor: "{% set result={} %}{% for card in obj %}{{ result.update({card.slot: {}}) or '' }}{% endfor %}{% for mda_name in mda_map %}{{ result.update({mda_name: {}}) or '' }}{% endfor %}{{ result | tojson }}"
  modules__module_type:
    commands:
      - command: "show card"
        parser: "ttp"
        jpath: "[0].cards[?admin_state=='up' || admin_state=='down']"
        post_processor: "{%- if '/' in current_key -%}{{ mda_map.get(current_key, '') }}{%- else -%}{%- for card in obj -%}{%- if card.slot == current_key -%}{{ card.card_type }}{%- endif -%}{%- endfor -%}{%- endif -%}"
        iterable_type: "str"
  modules__manufacturer:
    commands:
      - command: "show card"
        parser: "ttp"
        jpath: "[0].cards"
        post_processor: "{{ 'Nokia' }}"
        iterable_type: "str"
  modules__serial:
    commands:
      - command: "show card"
        parser: "ttp"
        jpath: "[0].cards"
        post_processor: "{{ '' }}"
        iterable_type: "str"
  modules__description:
    commands:
      - command: "show card"
        parser: "ttp"
        jpath: "[0].cards[?admin_state=='up' || admin_state=='down']"
        post_processor: "{%- if '/' in current_key -%}{{ mda_map.get(current_key, '') }}{%- else -%}{%- for card in obj -%}{%- if card.slot == current_key -%}{{ card.card_type }}{%- endif -%}{%- endfor -%}{%- endif -%}"
        iterable_type: "str"