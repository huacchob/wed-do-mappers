---
sync_devices:
  pre_processor:
    system_info:
      commands:
        - command: "show system info"
          parser: "raw"
          jpath: "raw"
          iterable_type: "dict"
          post_processor: |
            {% set ns = namespace(result={}) %}
            {% set tokens = obj.split() %}
            {% for i in range(tokens | length - 1) %}
              {% if tokens[i].endswith(':') %}
                {{ ns.result.update({tokens[i][:-1]: tokens[i + 1]}) or '' }}
              {% endif %}
            {% endfor %}
            {{ ns.result | tojson }}
  hostname:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{{ system_info.get('hostname', '') }}"
  serial:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{{ system_info.get('serial', '') }}"
  device_type:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{{ system_info.get('model', '') }}"
  mgmt_interface:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{{ 'management' }}"
  mask_length:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{% set nm = system_info.get('netmask', '') %}{% if nm %}{{ nm | netmask_to_cidr }}{% else %}32{% endif %}"
        iterable_type: "int"
sync_network_data:
  pre_processor:
    system_info:
      commands:
        - command: "show system info"
          parser: "raw"
          jpath: "raw"
          iterable_type: "dict"
          post_processor: |
            {% set ns = namespace(result={}) %}
            {% set tokens = obj.split() %}
            {% for i in range(tokens | length - 1) %}
              {% if tokens[i].endswith(':') %}
                {{ ns.result.update({tokens[i][:-1]: tokens[i + 1]}) or '' }}
              {% endif %}
            {% endfor %}
            {{ ns.result | tojson }}
  serial:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: "{{ system_info.get('serial', '') }}"
  software_version:
    commands:
      - command: "show system info"
        parser: "raw"
        jpath: "raw"
        post_processor: |
          {% set ns = namespace(value='') %}
          {% set tokens = obj.split() %}
          {% for i in range(tokens | length - 1) %}
            {% if tokens[i] == 'sw-version:' %}
              {% set ns.value = tokens[i + 1] %}
            {% endif %}
          {% endfor %}
          {{ ns.value }}
        iterable_type: "str"
  lldp_neighbors:
    root_key: true
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[*].chassis_id"
        post_processor: "{% set result={} %}{% for chassis_id in obj %}{{ result.update({chassis_id: {}}) or '' }}{% endfor %}{{ result | tojson }}"
  lldp_neighbors__local_interface:
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[?chassis_id=='{{ current_key }}'].local_interface"
        post_processor: "{% if obj and obj[0] %}{{ obj[0] }}{% else %}NA{% endif %}"
        iterable_type: "str"
  lldp_neighbors__neighbor_interface:
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[?chassis_id=='{{ current_key }}'].port_id"
        post_processor: "{% if obj and obj[0] %}{{ obj[0] }}{% else %}NA{% endif %}"
        iterable_type: "str"
  lldp_neighbors__neighbor_mgmt_address:
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[?chassis_id=='{{ current_key }}'].mgmt_address"
        post_processor: "{% if obj and obj[0] %}{{ obj[0] }}{% else %}NA{% endif %}"
        iterable_type: "str"
  lldp_neighbors__neighbor_name:
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[?chassis_id=='{{ current_key }}'].system_name"
        post_processor: "{% if obj and obj[0] %}{{ obj[0] }}{% else %}NA{% endif %}"
        iterable_type: "str"
  lldp_neighbors__neighbor_description:
    commands:
      - command: "show lldp neighbors all"
        parser: "textfsm"
        jpath: "[?chassis_id=='{{ current_key }}'].system_description"
        post_processor: "{% if obj and obj[0] %}{{ obj[0] }}{% else %}NA{% endif %}"
        iterable_type: "str"
