---
sync_devices:
  hostname:
    commands:
      - command: "show hostname"
        parser: "ttp"
        jpath: "[*].hostname"
        post_processor: "{{ obj[0] }}"
  serial:
    commands:
      - command: "show inventory"
        parser: "ttp"
        jpath: "[*].serial"
        post_processor: "{{ obj[0] }}"
  device_type:
    commands:
      - command: "show inventory"
        parser: "ttp"
        jpath: "[*].device_model"
        post_processor: "{{ obj[0] }}"
  mgmt_interface:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?contains(ip_address, `{{ obj }}/`)].{name: interface, enabled: link_status}"
        post_processor: "{{ (obj | selectattr('enabled', 'eq', 'up') | list | first ).name }}"
  mask_length:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?contains(ip_address, `{{ obj }}/`)].ip_address"
        post_processor: "{{ obj[0].split('/')[1] }}"
        iterable_type: "int"