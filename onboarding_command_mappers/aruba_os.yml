---
sync_devices:
  hostname:
    commands:
      - command: "show hostname"
        parser: "ttp"
        jpath: "[*].hostname"
        post_processor: "{{ obj[0] }}"
  serial:
    commands:
      - command: "show inventory"
        parser: "ttp"
        jpath: "[*].serial"
        post_processor: "{{ obj[0] }}"
  device_type:
    commands:
      - command: "show inventory"
        parser: "ttp"
        jpath: "[*].device_model"
        post_processor: "{{ obj[0] }}"
  mgmt_interface:
    commands:
      - command: "show ip interface brief"
        parser: "ttp"
        jpath: "[?self_ip=='{{ obj }}'].interface"
        post_processor: "{{ obj[0] }}"
  mask_length:
    commands:
      - command: "show ip interface brief"
        parser: "ttp"
        jpath: "[?self_ip=='{{ obj }}'].netmask"
        post_processor: "{{ obj[0] | netmask_to_cidr }}"
        iterable_type: "int"